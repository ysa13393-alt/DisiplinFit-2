
name: Build DisiplinFit APK

on:
  workflow_dispatch:
  push:
    branches: [main, ana]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: ZIP dosyasından projeyi çıkar
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p project
            unzip -o "$ZIP_FILE" -d project
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      - name: APK oluştur
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: APK dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: DisiplinFit-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
