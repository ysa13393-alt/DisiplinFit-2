
name: Build DisiplinFit APK

on:
  workflow_dispatch:
  push:
    branches: [ana, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ZIP dosyasından projeyi çıkar
        run: |
          unzip -q "DisiplinFit_Android_Projesi (3).zip" -d project
          find project -type f -name gradlew

      - name: APK oluştur
        run: |
          GRADLEW="$(find project -type f -name gradlew | head -n 1)"
          if [ -z "$GRADLEW" ]; then
            echo "ZIP içinde gradlew dosyası bulunamadı."
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: DisiplinFit-APK
          path: project/**/build/outputs/apk/debug/*.apk
